
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    container_name: cloudflared
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

  n8n:
    build: .
    image: n8nio/n8n:latest
    restart: unless-stopped
    container_name: n8n
    ports:
      - 5678:5678
    environment:
      # Corrections des avertissements de dépréciation
      - DB_SQLITE_POOL_SIZE=5
      - N8N_RUNNERS_ENABLED=true
      # Amélioration sécurité et performance
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_GIT_NODE_DISABLE_BARE_POS=true
      # Garder l'accès aux variables d'env dans Code Node si nécessaire
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # configuration de l'api publique
      - N8N_PUBLIC_API_DISABLED=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    external: true
